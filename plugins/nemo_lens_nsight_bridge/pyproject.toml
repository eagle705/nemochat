[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-lens-nsight-bridge-control"
version = "0.1.0"
description = "Explicit opt-in educational MoE Lens/NVTX configuration bridge"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["lens_nsight_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
